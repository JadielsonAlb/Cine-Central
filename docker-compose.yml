services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingressos
      POSTGRES_PASSWORD: ingressos123
      POSTGRES_DB: ingressos_db
    command: postgres -c max_connections=200
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ingressos -d ingressos_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://ingressos:ingressos123@db:5432/ingressos_db
      JWT_SECRET: troque-esta-chave
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata: